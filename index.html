<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tic-Tac-Toe</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .game-container {
            width: 380px;
            max-width: 95%;
            background: white;

            padding: 30px;
            border-radius: 20px;

            text-align: center;

            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        h1 {
            color: #333;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #777;
            margin-bottom: 20px;
        }

        .mode-selection {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .mode-btn {
            flex: 1;

            padding: 12px 8px;

            border: none;
            border-radius: 8px;

            background: #eee;

            font-size: 14px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        .mode-btn:hover {
            background: #ddd;
        }

        .mode-btn.active {
            background: #667eea;
            color: white;
        }

        #status {
            font-size: 18px;
            font-weight: bold;

            margin-bottom: 20px;

            color: #444;
        }
        .board {
            display: grid;

            grid-template-columns: repeat(3, 100px);

            gap: 8px;

            justify-content: center;
        }

        .cell {
            width: 100px;
            height: 100px;

            border: none;
            border-radius: 10px;

            background: #f1f1f1;

            font-size: 42px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        .cell:hover {
            background: #ddd;
        }

        .cell.x {
            color: #667eea;
        }

        .cell.o {
            color: #e05252;
        }

        .cell.win {
            background: #90ee90 !important;
        }

        #restart {
            margin-top: 25px;

            padding: 12px 30px;

            border: none;
            border-radius: 8px;

            background: #667eea;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        #restart:hover {
            background: #4d61c7;
        }

        @media (max-width: 400px) {

            .board {
                grid-template-columns: repeat(3, 80px);
            }

            .cell {
                width: 80px;
                height: 80px;

                font-size: 34px;
            }

        }

    </style>

</head>

<body>

<div class="game-container">

    <h1> Tic-Tac-Toe</h1>

    <p class="subtitle">Choose how you want to play</p>
    <div class="mode-selection">

        <button
            id="multiBtn"
            class="mode-btn active"
            onclick="setMode('multiplayer')">

             Multiplayer

        </button>

        <button
            id="aiBtn"
            class="mode-btn"
            onclick="setMode('ai')">

             Play with AI

        </button>

    </div>


    <!-- Status -->

    <p id="status">
        Player X's Turn
    </p>


    <!-- Game Board -->

    <div class="board">

        <button class="cell" data-index="0"></button>

        <button class="cell" data-index="1"></button>

        <button class="cell" data-index="2"></button>

        <button class="cell" data-index="3"></button>

        <button class="cell" data-index="4"></button>

        <button class="cell" data-index="5"></button>

        <button class="cell" data-index="6"></button>

        <button class="cell" data-index="7"></button>

        <button class="cell" data-index="8"></button>

    </div>


    <!-- Restart -->

    <button id="restart">
         New Game
    </button>

</div>


<script>

    const cells = document.querySelectorAll(".cell");

    const statusText =
        document.getElementById("status");

    const restartButton =
        document.getElementById("restart");

    const multiBtn =
        document.getElementById("multiBtn");

    const aiBtn =
        document.getElementById("aiBtn");


    let board = [
        "", "", "",
        "", "", "",
        "", "", ""
    ];


    let currentPlayer = "X";

    let gameActive = true;

    let gameMode = "multiplayer";


    const winningConditions = [

        [0, 1, 2],

        [3, 4, 5],

        [6, 7, 8],

        [0, 3, 6],

        [1, 4, 7],

        [2, 5, 8],

        [0, 4, 8],

        [2, 4, 6]

    ];

    function setMode(mode) {

        gameMode = mode;

        if (mode === "multiplayer") {

            multiBtn.classList.add("active");

            aiBtn.classList.remove("active");

        }

        else {

            aiBtn.classList.add("active");

            multiBtn.classList.remove("active");

        }

        restartGame();

    }
    cells.forEach(cell => {

        cell.addEventListener("click", function () {

            const index =
                this.dataset.index;


            if (
                !gameActive ||
                board[index] !== ""
            ) {

                return;

            }

            if (
                gameMode === "ai" &&
                currentPlayer === "O"
            ) {

                return;

            }


            makeMove(index, currentPlayer);


            if (!gameActive) {

                return;

            }
            if (gameMode === "ai") {

                statusText.textContent =
                    " AI is thinking...";

                setTimeout(aiMove, 500);

            }

            else {

                switchPlayer();

            }

        });

    });
    function makeMove(index, player) {

        board[index] = player;

        cells[index].textContent = player;

        cells[index].classList.add(
            player.toLowerCase()
        );


        checkGame();

    }
    function switchPlayer() {

        currentPlayer =
            currentPlayer === "X"
                ? "O"
                : "X";


        if (gameMode === "ai") {

            if (currentPlayer === "X") {

                statusText.textContent =
                    "Your Turn - X";

            }

        }

        else {

            statusText.textContent =
                "Player " +
                currentPlayer +
                "'s Turn";
        }
    }
    function checkGame() {

        for (
            let condition of winningConditions
        ) {

            const a = condition[0];

            const b = condition[1];

            const c = condition[2];


            if (

                board[a] !== "" &&

                board[a] === board[b] &&

                board[a] === board[c]

            ) {

                cells[a].classList.add("win");

                cells[b].classList.add("win");

                cells[c].classList.add("win");


                if (
                    gameMode === "ai"
                ) {

                    if (currentPlayer === "X") {

                        statusText.textContent =
                            " You Win!";

                    }

                    else {

                        statusText.textContent =
                            "AI Wins!";

                    }

                }

                else {

                    statusText.textContent =
                        " Player " +
                        currentPlayer +
                        " Wins!";

                }


                gameActive = false;

                return true;

            }

        }
        if (!board.includes("")) {

            statusText.textContent =
                " It's a Draw!";

            gameActive = false;

            return true;

        }


        return false;

    }
    function aiMove() {

        if (!gameActive) {

            return;

        }
        let move = findWinningMove("O");
        if (move === -1) {

            move =
                findWinningMove("X");

        }
        if (
            move === -1 &&
            board[4] === ""
        ) {

            move = 4;

        }
        if (move === -1) {

            const corners =
                [0, 2, 6, 8];


            const availableCorners =
                corners.filter(
                    index => board[index] === ""
                );


            if (
                availableCorners.length > 0
            ) {

                move =
                    availableCorners[
                        Math.floor(
                            Math.random() *
                            availableCorners.length
                        )
                    ];

            }

        }


        /*
            Take random empty cell
        */

        if (move === -1) {

            const emptyCells = [];


            for (
                let i = 0;
                i < board.length;
                i++
            ) {

                if (board[i] === "") {

                    emptyCells.push(i);

                }

            }


            move =
                emptyCells[
                    Math.floor(
                        Math.random() *
                        emptyCells.length
                    )
                ];

        }

        currentPlayer = "O";

        makeMove(move, "O");


        if (!gameActive) {

            return;

        }


        currentPlayer = "X";

        statusText.textContent =
            "Your Turn - X";

    }


    function findWinningMove(player) {

        for (
            let condition of winningConditions
        ) {

            const a = condition[0];

            const b = condition[1];

            const c = condition[2];


            if (

                board[a] === player &&

                board[b] === player &&

                board[c] === ""

            ) {

                return c;

            }


            if (

                board[a] === player &&

                board[c] === player &&

                board[b] === ""

            ) {

                return b;

            }


            if (

                board[b] === player &&

                board[c] === player &&

                board[a] === ""

            ) {

                return a;

            }

        }


        return -1;

    }


    /*
        NEW GAME
    */

    restartButton.addEventListener(
        "click",
        restartGame
    );


    function restartGame() {

        board = [

            "", "", "",

            "", "", "",

            "", "", ""

        ];


        currentPlayer = "X";

        gameActive = true;


        cells.forEach(cell => {

            cell.textContent = "";

            cell.classList.remove(
                "x",
                "o",
                "win"
            );

        });


        if (gameMode === "ai") {

            statusText.textContent =
                "Your Turn - X";

        }

        else {

            statusText.textContent =
                "Player X's Turn";

        }

    }

</script>

</body>
</html>
